version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'saturday'
          time: '08:00'
          timezone: 'Europe/Prague'
      target-branch: 'develop'
      assignees:
          - 'janslifka'
      groups:
          minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'
      ignore:
          # @ufal/license-selector relies on lodash 3 APIs removed in lodash 4
          - dependency-name: 'lodash'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'saturday'
          time: '08:00'
          timezone: 'Europe/Prague'
      target-branch: 'develop'
      assignees:
          - 'janslifka'
